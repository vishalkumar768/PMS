services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - internal
    depends_on:
      - api-gateway
      - grafana

  kafka:
    image: apache/kafka-native:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass "StrongPassword123!" --maxmemory 48mb --maxmemory-policy allkeys-lru
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    image: vk28122812/pms:api-gateway
    container_name: api-gateway
    networks:
      - internal
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: StrongPassword123!
      JAVA_TOOL_OPTIONS: "-Xtune:virtualized -Xquickstart -Xms32m -Xmx96m -Xss256k -XX:+IdleTuningGcOnIdle"
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      billing-service:
        condition: service_started
      analytics-service:
        condition: service_started

  billing-service:
    build: ./billing-service
    image: vk28122812/pms:billing-service
    container_name: billing-service
    networks:
      - internal
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xtune:virtualized -Xquickstart -Xms32m -Xmx96m -Xss256k -XX:+IdleTuningGcOnIdle"
    depends_on:
      kafka:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    image: vk28122812/pms:analytics-service
    container_name: analytics-service
    networks:
      - internal
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xtune:virtualized -Xquickstart -Xms32m -Xmx96m -Xss256k -XX:+IdleTuningGcOnIdle"
    depends_on:
      kafka:
        condition: service_healthy

  patient-service:
    build: ./patient-service
    image: vk28122812/pms:patient-service
    container_name: patient-service
    networks:
      - internal
    environment:
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patient_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CACHE_TYPE: REDIS
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: StrongPassword123!
      JAVA_TOOL_OPTIONS: "-Xtune:virtualized -Xquickstart -Xms48m -Xmx128m -Xss256k -XX:+IdleTuningGcOnIdle"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      billing-service:
        condition: service_started

  auth-service:
    build: ./auth-service
    image: vk28122812/pms:auth-service
    container_name: auth-service
    networks:
      - internal
    environment:
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: bf17dfc038c823d921976218093b982b8922e802df4dd2c6260c00927c9375bb
      JAVA_TOOL_OPTIONS: "-Xtune:virtualized -Xquickstart -Xms32m -Xmx96m -Xss256k -XX:+IdleTuningGcOnIdle"
    depends_on:
      postgres:
        condition: service_healthy

  appointment-service:
    build: ./appointment-service
    image: vk28122812/pms:appointment-service
    container_name: appointment-service
    networks:
      - internal
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JAVA_TOOL_OPTIONS: "-Xtune:virtualized -Xquickstart -Xms32m -Xmx96m -Xss256k -XX:+IdleTuningGcOnIdle"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

